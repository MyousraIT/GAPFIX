<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1220">
<title>Join GapLens</title>
<meta name="description" content="Join GapLens as an investor, mentor, client or team member.">
<style>
:root{
--navy:#0D1220; --card:#131826; --card2:#171e30; --line:#263048;
--teal:#1D9E75; --tealL:#5DCAA5; --gold:#E8A020; --text:#FFFFFF; --muted:#9AA5B8; --err:#FF7A59;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--text);
font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.6;pointer-events:none}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;
padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.brand img.wm{height:34px;width:auto;display:block}
.brand span{font-weight:800;font-size:22px;letter-spacing:.2px}
.brand b{color:var(--gold)}
h1{font-size:40px;line-height:1.08;margin:0 0 12px;font-weight:800;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--muted);font-size:18px;line-height:1.45;margin:0 0 26px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;margin:0 0 22px}
.role{appearance:none;-webkit-appearance:none;position:relative;text-align:left;cursor:pointer;
background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 14px 14px;color:var(--text);
font:inherit;display:flex;flex-direction:column;gap:12px;min-height:116px;
transition:border-color .18s,transform .18s,background .18s,box-shadow .18s}
.role:hover{border-color:#34415f}
.role:active{transform:scale(.98)}
.role:focus-visible{outline:3px solid var(--tealL);outline-offset:2px}
.role svg{width:30px;height:30px;stroke:var(--tealL);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.role .en{font-size:17.5px;font-weight:700;line-height:1.15}
.role .ar{font-size:14px;color:var(--muted);margin-top:3px}
.role .tick{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--gold);
display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:.18s}
.role .tick svg{width:13px;height:13px;stroke:var(--navy);stroke-width:3}
.role[aria-checked="true"]{border-color:var(--teal);background:var(--card2);box-shadow:0 0 0 3px rgba(29,158,117,.18)}
.role[aria-checked="true"] svg:not(.tk){stroke:var(--gold)}
.role[aria-checked="true"] .tick{opacity:1;transform:scale(1)}
.role.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:84px;padding:16px 18px}
.role.wide .tick{top:50%;margin-top:-11px}
form{display:none;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
form.show{display:block;opacity:1;transform:none}
.field{margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;letter-spacing:.3px}
label i{color:var(--gold);font-style:normal}
input,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--text);
font:inherit;font-size:16px;padding:14px 14px;outline:none;transition:border-color .15s}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#5b6680}
input:focus,textarea:focus{border-color:var(--tealL)}
.invalid{border-color:var(--err)!important}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.btn{width:100%;border:0;border-radius:16px;padding:17px 18px;font:inherit;font-size:17px;font-weight:800;
color:var(--navy);background:linear-gradient(90deg,var(--tealL),var(--gold));cursor:pointer;margin-top:6px;
transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.6;cursor:default}
.note{color:#6f7b93;font-size:13px;line-height:1.5;text-align:center;margin:14px 0 0}
.msg{display:none;margin:12px 0 0;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;background:rgba(255,122,89,.1);
border:1px solid rgba(255,122,89,.4);color:#ffc2b3}
.msg a{color:#fff}
.thanks{display:none;text-align:center;padding:36px 6px 10px}
.thanks .ring{width:76px;height:76px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
background:rgba(29,158,117,.15);border:2px solid var(--teal)}
.thanks .ring svg{width:36px;height:36px;stroke:var(--tealL);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.thanks h2{font-size:30px;margin:0 0 10px}
.thanks p{color:var(--muted);font-size:18px;line-height:1.5;margin:0 0 26px}
.link{background:none;border:0;color:var(--tealL);font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:underline}
.tag{margin-top:34px;text-align:center;color:var(--tealL);font-weight:700;letter-spacing:3px;font-size:12px}
@media (min-width:520px){h1{font-size:46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<h1>Join <em>GapLens.</em></h1>
<p class="sub">How would you like to be part of it?</p>
<div class="grid" role="radiogroup" aria-label="Choose your role">
<button type="button" class="role" role="radio" aria-checked="false" data-role="Investor">
<svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
<div><div class="en">Investor</div><div class="ar">مستثمر</div></div>

</button>

<div><div class="en">Mandator</div><div class="ar">منذاتور</div></div>
<span class="tick"><svg class="tk" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></span>
</button>

</button>
<button type="button" class="role" role="radio" aria-checked="false" data-role="Team member">

<div><div class="en">Team member</div><div class="ar">عضو فريق</div></div>

</button>
<button type="button" class="role" role="radio" aria-checked="false" data-role="Learn more">

<span class="tick"><svg class="tk" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></span>

</button>
</div>
<form id="form" novalidate autocomplete="on">
<div class="field"><label for="name">Your name <i>*</i></label>
<input id="name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Full name"></div>
<div class="field"><label for="email">Email <i>*</i></label>
<input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="you@example.com"></div>
<div class="field"><label for="phone">WhatsApp or phone <span style="font-weight:400">(optional)</span></label>
<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="+974 ..."></div>
<div class="field"><label for="org" id="orgLabel">Company or organization <span style="font-weight:400">(optional)</span></label>
<input id="org" name="org" type="text" maxlength="100" placeholder=""></div>
<div class="field"><label for="message" id="msgLabel">Anything you'd like me to know? <span style="font-weight:400">(optional)</span></label>
<textarea id="message" name="message" maxlength="600" placeholder="A short note is enough."></textarea></div>
<input class="hp" type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" id="send" type="submit">Send to Yousra</button>
<div class="msg" id="msg" role="alert"></div>
<p class="note">Your details go only to Yousra at GapLens. I reply personally.</p>
<p class="note" id="dbg" style="display:none;color:#5DCAA5"></p>
</form>
</section>
<section class="thanks" id="thanks" aria-live="polite">
<div class="ring"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></div>
<h2 id="thanksTitle">Thank you.</h2>
<p>I received your message and I will write to you personally.</p>
<button class="link" id="again" type="button">Send another</button>
</section>
<div class="tag">SEE THE GAPS. BEFORE YOU INVEST.</div>
</main>
<script>
(function(){
var ENDPOINT = "";
var TO = "yousra@gaplens.co";
var ORG = {
"Investor":    ["Fund or organization", "Optional"],
"Mandator":    ["Your organization or role", "Optional"],
"Client":      ["Your business", "Business name and what it does"],
"Team member": ["Your skills", "For example: design, sales, development"],
"Learn more":  ["Company or organization", "Optional"]
};
var MSG = { "Learn more": "What would you like to know?" };
var role = "";
var form = document.getElementById("form");
var grid = document.querySelectorAll(".role:not(.nope)");
var msg = document.getElementById("msg");
var send = document.getElementById("send");
function select(btn){
role = btn.getAttribute("data-role");
for (var i=0;i<grid.length;i++) grid[i].setAttribute("aria-checked", grid[i]===btn ? "true":"false");
var o = ORG[role];
document.getElementById("orgLabel").innerHTML = o[0] + ' <span style="font-weight:400">(optional)</span>';
document.getElementById("org").placeholder = o[1];
document.getElementById("msgLabel").innerHTML = (MSG[role] || "Anything you'd like me to know?") + ' <span style="font-weight:400">(optional)</span>';
if (!form.classList.contains("show")) {
form.style.display = "block";
requestAnimationFrame(function(){ form.classList.add("show"); });
setTimeout(function(){ form.scrollIntoView({behavior:"smooth", block:"start"}); }, 120);
}
}
for (var i=0;i<grid.length;i++) grid[i].addEventListener("click", function(){ select(this); });
function showMsg(html){ msg.innerHTML = html; msg.style.display = "block"; }
function clearMsg(){ msg.style.display = "none"; }
function mark(el, bad){ el.classList.toggle("invalid", !!bad); }
function mailto(d){
var body = "Role: " + d.role + "\nName: " + d.name + "\nEmail: " + d.email +
(d.phone ? "\nPhone: " + d.phone : "") + (d.org ? "\n" + d.orgLabel + ": " + d.org : "") +
(d.message ? "\n\n" + d.message : "");
return "mailto:" + TO + "?subject=" + encodeURIComponent("[GapLens] " + d.role + ": " + d.name) +
"&body=" + encodeURIComponent(body);
}
function done(name){
document.getElementById("pick").style.display = "none";
document.getElementById("thanksTitle").textContent = "Thank you, " + name.split(" ")[0] + ".";
document.getElementById("thanks").style.display = "block";
window.scrollTo(0,0);
}
form.addEventListener("submit", function(ev){
ev.preventDefault(); clearMsg();
if (!role) { showMsg("Please choose how you would like to join."); return; }
var name = document.getElementById("name"), email = document.getElementById("email");
var okName = name.value.trim().length >= 2;
var okMail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
mark(name, !okName); mark(email, !okMail);
if (!okName || !okMail) { showMsg("Please add your name and a valid email."); return; }
var d = {
role: role, name: name.value.trim(), email: email.value.trim(),
phone: document.getElementById("phone").value.trim(),
org: document.getElementById("org").value.trim(),
orgLabel: ORG[role][0],
message: document.getElementById("message").value.trim(),
website: document.getElementById("website").value,   // honeypot: must stay empty
page: location.href, sentAt: new Date().toISOString()
};
var DEBUG = /[?&]debug/.test(location.search);
function dbg(s){ var el=document.getElementById("dbg"); if(DEBUG && el){ el.style.display="block"; el.textContent="debug: "+s; } }
function back(){ send.disabled = false; send.textContent = "Send to Yousra"; }
function fail(why){
back();
showMsg('We could not send this automatically. Please <a href="' + mailto(d) + '">email me directly</a> at ' + TO + ' or try again.');
dbg(why);
}
if (!ENDPOINT) {
dbg("ENDPOINT is empty. Paste the Apps Script web app URL into join.html.");
showMsg('Opening your email app. If nothing opens, please write to <a href="' + mailto(d) + '">' + TO + '</a>.');
window.location.href = mailto(d);
return;
}
send.disabled = true; send.textContent = "Sending...";
var ctrl = ("AbortController" in window) ? new AbortController() : null;
var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 15000);
var opts = { method: "POST", headers: {"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(d) };
if (ctrl) opts.signal = ctrl.signal;
fetch(ENDPOINT, opts).then(function(r){ return r.text(); }).then(function(txt){
clearTimeout(timer); txt = (txt || "").trim(); dbg("server replied: " + txt.slice(0,60));
if (txt === "ok" || txt === "duplicate") done(d.name);
else fail("server replied: " + txt.slice(0,60));
}).catch(function(err){
var o2 = { method: "POST", mode: "no-cors", headers: opts.headers, body: opts.body };
fetch(ENDPOINT, o2).then(function(){ clearTimeout(timer); dbg("sent, reply unreadable (" + err + ")"); done(d.name); })
.catch(function(e2){ clearTimeout(timer); fail("network: " + e2); });
});
});
document.getElementById("again").addEventListener("click", function(){
form.reset(); role = "";
for (var i=0;i<grid.length;i++) grid[i].setAttribute("aria-checked","false");
form.classList.remove("show"); form.style.display = "none";
send.disabled = false; send.textContent = "Send to Yousra";
document.getElementById("thanks").style.display = "none";
document.getElementById("pick").style.display = "block";
});
(function(){
var gridEl = document.querySelector(".grid"), nope = document.getElementById("nope"), busy = false;
function inside(r, x, y, pad){ return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad; }
function flee(px, py){
if (busy) return;
var kids = Array.prototype.slice.call(gridEl.children).filter(function(k){ return k !== nope; });
var options = kids.filter(function(k){ return !inside(k.getBoundingClientRect(), px, py, 0); });
if (!options.length) options = kids;
var other = options[Math.floor(Math.random() * options.length)];
var r1 = nope.getBoundingClientRect(), r2 = other.getBoundingClientRect();
var ph = document.createComment("");
gridEl.replaceChild(ph, nope); gridEl.replaceChild(nope, other); gridEl.replaceChild(other, ph);
var n1 = nope.getBoundingClientRect(), n2 = other.getBoundingClientRect();
[[nope, r1, n1], [other, r2, n2]].forEach(function(a){
var el = a[0], dx = a[1].left - a[2].left, dy = a[1].top - a[2].top;
el.style.transition = "none"; el.style.transform = "translate(" + dx + "px," + dy + "px)";
void el.offsetWidth;
el.style.transition = "transform .28s cubic-bezier(.2,.9,.3,1.1)"; el.style.transform = "";
});
busy = true;
setTimeout(function(){ busy = false; nope.style.transition = ""; other.style.transition = ""; }, 320);
}
gridEl.addEventListener("mousemove", function(e){
if (inside(nope.getBoundingClientRect(), e.clientX, e.clientY, 10)) flee(e.clientX, e.clientY);
});
function press(e){
if (e.preventDefault) e.preventDefault();
var pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
flee(pt.clientX, pt.clientY);
}
nope.addEventListener("touchstart", press, {passive:false});
nope.addEventListener("pointerdown", press);
nope.addEventListener("click", function(e){ e.preventDefault(); });
})();
var c = document.getElementById("bg");
if (c.getContext && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
var x = c.getContext("2d"), W, H, pts = [], N = 38;
function size(){ W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
size(); window.addEventListener("resize", size);
for (var k=0;k<N;k++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,g:Math.random()<.08});
(function loop(){
x.clearRect(0,0,W,H);
for (var a=0;a<N;a++){
var p=pts[a]; p.x+=p.vx; p.y+=p.vy;
if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
for (var b=a+1;b<N;b++){
var q=pts[b], dx=p.x-q.x, dy=p.y-q.y, dist=Math.sqrt(dx*dx+dy*dy);
if(dist<150){ x.strokeStyle="rgba(29,158,117,"+(0.22*(1-dist/150))+")"; x.lineWidth=1; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(q.x,q.y); x.stroke(); }
}
x.fillStyle = p.g ? "rgba(232,160,32,.75)" : "rgba(93,202,165,.6)";
x.beginPath(); x.arc(p.x,p.y,p.g?2.6:2,0,6.283); x.fill();
}
requestAnimationFrame(loop);
})();
}
})();
</script>
</body>
</html>
